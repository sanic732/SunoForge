<!-- SunoForge v5.0 · menu widget (compact) · CORE_00 §9 MENU UI · widgets/UI.md
ONE WIDGET, EVERY MENU SCREEN: the main screen (with "You don't have to press anything — just describe the song"), the
submenus, "What's new" and the mode switch are inside; a tap on an entry with sub-entries opens it IN the widget (no
message, no wait); [1], [10], [11] and [15] send their number ([15] opens the panel, widgets/hub.html); a sub-entry,
a line of "What's new", "Fill-in form" or a setting sends a message.
Simple mode: six tiles ([1] [5] [6] [12], [15] or [7] when PLATFORMS has no Suno, All sections = every number),
then, in both modes, the Lab entry with its red BETA tag (it sends `S6 keys`: widgets/lab/keys.html),
3–5 sub-entries with their info-line, the rest under "Show all sub-entries". Extended: every tile and sub-entry,
the info-lines in a fold. Every number is always reachable; only sub-entries filter: "(Suno app)" ones are hidden
when PLATFORMS has no Suno, and their badge shows in Extended only.
TRANSLATED COPIES: widgets/<lang>/menu.html is this template already translated — take it as it is. This English copy is
for English, and for a language without a copy, where you translate the values of M, SUB and UI (codes, `set lang …`
messages and the languages' own names stay).
The voice catalogue (5a) is its own widget, widgets/voices.html.
FILL ONLY the six attributes of the root div, escaped for an attribute (& < > " ' as entities):
  data-mcp="on" | "off"     the Suno server in this session
  data-screen="main"        "main", an entry number ("3") or "new" (What's new)
  data-mode="simple"        "simple" (default for a new user) | "extended"   (USER_LEVEL)
  data-p="Suno v6"          the platform in use ("Lyria 3.5" for a Lyria user)
  data-pl="all"             PLATFORMS as in the preloader: "all" or the list ("lyria, flow")
  data-l="Auto → Русский"   the language in use, by its own name; "auto → <name>" under auto
Print the rest exactly as it is, this comment stripped: no re-indenting, nothing added. No emoji, host colours only;
the widget never calls a tool and never spends. -->
