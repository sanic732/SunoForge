<!-- SunoForge v5.0.4 · LAB · 15q keys — the melody keys (experimental) · widgets/UI.md
The first line is the red BETA notice (the idea is under test; feedback decides). An on-screen piano: the user records a melody (how long a key is held = the note's length, snapped to 1/8 or 1/4;
a silence between two notes becomes a rest, snapped the same way, at most 4 beats; the Rest key adds one too), hears it back, and "Send to SunoForge" sends ONE message. Keys C3-C5 (one octave C4-C5
when narrower than 540 px), ◀ ▶ shift; on a computer keyboard A W S E D F T G Y H U J K play the upper octave,
Space = rest, Z / X = octave. The message:
  15q notes bpm=<bpm> <NOTE:BEATS ...>     answer it as the code 15q notes (scripts/notes2mid.py where a shell exists)
LAB = experimental: say so in one line above it. The widget never calls a tool and spends nothing; no network, no
storage. Sound through WebAudio where the host allows it; where it does not, the keys stay silent and still record.
ONE FILE FOR ALL NINE LANGUAGES (the labels are inside; there is no translated copy). FILL ONLY the two attributes
of the root div:
  data-lang="en"   en ru uk de es fr it pt-BR id = OUTPUT_LANG; any other language: "en"
  data-bpm="96"    the starting tempo, 40-240: the song's tempo when one is known, else 96
Print the rest exactly as it is, this comment stripped: no re-indenting, nothing added. -->
