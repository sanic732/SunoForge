<!-- SunoForge v5.0 · [15] SUNO + MCP panel template · DATA_SUNO_LIVE §7 (MCP MENU, MY SONGS, SONG ACTIONS, MIX, cards), §9
Rendered through the host's widget tool (the one whose notes name a global sendPrompt). Laid out like the Suno app, one
screen at a time, nothing loaded that was not asked for. KEEP EXACTLY ONE SCREEN and drop the others:
  HUB             — [15], `mcp-menu`, "15": widgets/hub.html (the status line and the sections), not this file.
  LIST (#sm-list) — after a filter, `find`, `liked`, a playlist's or a workspace's songs, `15n` (pick two); a plain
                    `15h` (10 rows, no filter) is widgets/songs.html:
                    the rows of library-list (`limit` = n: 10 or 50; 100 = two pages with next_cursor).
  PICK (#sm-pl)   — `15i` / `15j` (open one), a song's "To a playlist" / "To a workspace" (`15i #id8 …` / `15j #id8 …`,
                    the song goes into the one tapped), the editor's `workspace: pick`: the user's EXISTING playlists
                    (playlists-list, free) or workspaces (workspaces-list, free) as rows, and under them a name field
                    for a new one. None yet → no rows; the field stays.
Fill the slots, strip the comments. TRANSLATED COPIES: widgets/<lang>/ holds this template already translated (ru uk; other languages: translate this English copy) — take that copy and only fill the slots; this English one is for English and for a language without a copy, where you translate every visible label (the L object of the script included).
ESCAPING — every slot is escaped for where it lands: in HTML text and in attributes replace & < > " ' with entities.
Song titles and styles come from the server and may be anyone's: they go only into HTML text or data-* attributes,
never into the script. Labels in L are SunoForge's own words: write them without the ASCII apostrophe (use ’).
WHAT THE WIDGET DOES — it never calls a tool and never spends. A tap on a row opens its action sheet inside the
widget, grouped as the Suno app's song menu (Remix · Edit · Look inside · Keep; Remix and Edit send `15m`, which
opens widgets/editor.html in that mode); an action sends "<code> #<first 8 characters of the id> <row> [<what>] ·
<label>" with sendPrompt (the label is cleaned of line breaks, brackets, # and quotes and cut to 60 characters).
"Listen" sends `15c #id8 <row> play` (audio-wait: Suno's player in the chat); "Open on suno.com" opens the page with
openLink (the host asks first) — some library songs do not play in the card (DATA_SUNO_LIVE §7). "Link" copies the address. MIX: "Pick two" turns the rows into a choice
of two songs (A, then B); three buttons then send `15n #A8 #B8 mashup|style|cover · <A> + <B>`. No cover images and
no audio: the sandbox loads nothing from suno.com's servers.
No Suno server in the session: the HUB only, every item that needs it marked "needs the Suno connector".
SLOTS — LIST: {{LIST}} what is shown (my songs, liked, a filter, a playlist, search words); on #sm-list data-n = the count
shown (10 · 50 · 100), data-f = the filter word of `15h` in force ("" for all), data-list="playlist" or "workspace"
for a playlist's or a workspace's songs (the sheet then offers "remove from it"), data-pick="<code #id8 what with>"
when one second song must be picked for an editor (a tap sends that prefix with the song), data-mix="1" to open
straight in "pick two" (`15n`). SONG ROWS: one <button class="sm-row"> per song, newest first — data-id = the clip
id, data-u = its song_url, data-k = its kind when not plain (cover, extension, upload, remaster) else empty,
data-lk="1" when liked, data-own="0" for someone else's song (from library-liked); inside: the row number, the
title, length m:ss and date, the heart only when liked.
PICK: {{PICK_HEAD}} "Your playlists" · "Your workspaces" · "Add «<title>» to a playlist" · "Move «<title>» to a
workspace"; on #sm-pl data-kind="playlist" or "workspace", data-song = the song's id8 when one is being added (else
""), data-title = its title (escaped), data-pick = the editor's prefix in pick mode (else ""), data-more="1" when
the tool returned next_cursor. ROWS: one <button class="sm-row sm-pl"> per playlist or workspace, as the tool lists
them — data-id = its id, data-name = its name (escaped); inside the name and one line: the clip count and, for a
playlist, its visibility.
VIEW LINE — the three small pills at the foot (M menu · T text · B buttons) are the view switch of CORE_00 §9; in a
widget M is the one in force. -->

function mixDraw(){var bar=$('sm-mixbar');bar.innerHTML='';if(!mix){bar.style.display='none';document.querySelectorAll('#sm-songs .sm-row').forEach(function(r){r.classList.remove('sel');var ab=r.querySelector('.sm-ab');if(ab)ab.remove();});return;}
bar.style.display='';document.querySelectorAll('#sm-songs .sm-row').forEach(function(r){r.classList.remove('sel');var ab=r.querySelector('.sm-ab');if(ab)ab.remove();});
[['A',mix.a],['B',mix.b]].forEach(function(x){if(!x[1])return;x[1].r.classList.add('sel');var ab=el('span','sm-ab',x[0]);x[1].r.insertBefore(ab,x[1].r.firstChild);});
bar.appendChild(el('p',null,!mix.a?L.mix_a:!mix.b?L.mix_b:L.mix_ok));
if(mix.a&&mix.b){var g=el('div','sm-chips');[['mashup',L.mx_mashup],['style',L.mx_style],['cover',L.mx_cover]].forEach(function(x){var b=el('button','sm-f sm-on',x[1]);b.addEventListener('click',function(){say('15n #'+mix.a.id8+' #'+mix.b.id8+' '+x[0]+' · '+mix.a.t+' + '+mix.b.t);});g.appendChild(b);});
var sw=el('button','sm-f',L.mx_swap);sw.addEventListener('click',function(){var t=mix.a;mix.a=mix.b;mix.b=t;mixDraw();});g.appendChild(sw);bar.appendChild(g);bar.appendChild(el('p',null,L.mx_note));}
var c=el('button','sm-f',L.mx_cancel);c.addEventListener('click',function(){mix=null;mixDraw();});bar.appendChild(c);}
$('sm-mixgo').addEventListener('click',function(){document.querySelectorAll('#sm-songs .sm-sheet').forEach(function(x){x.remove();});mix={a:null,b:null};mixDraw();});
if(ctx||pick)$('sm-mixgo').style.display='none';
document.querySelectorAll('#sm-songs .sm-row').forEach(function(r){r.addEventListener('click',function(){
  var me=rowInfo(r);
  if(pick){if(me.id8)say(pick+' #'+me.id8+' '+me.n+' · '+me.t);return;}
  if(mix){if(mix.a&&mix.a.r===r){mix.a=mix.b;mix.b=null;}else if(mix.b&&mix.b.r===r){mix.b=null;}else if(!mix.a){mix.a={r:r,id8:me.id8,t:me.t};}else if(!mix.b){mix.b={r:r,id8:me.id8,t:me.t};}mixDraw();return;}
  var open=r.nextElementSibling&&r.nextElementSibling.classList.contains('sm-sheet');
  document.querySelectorAll('#sm-songs .sm-sheet').forEach(function(x){x.remove();});
  if(open)return;
  var u=r.getAttribute('data-u')||'',k=r.getAttribute('data-k')||'',lk=r.getAttribute('data-lk')==='1',own=r.getAttribute('data-own')!=='0',id8=me.id8;
  function msg(c,a){return c+' #'+id8+' '+me.n+(a?' '+a:'')+' · '+me.t;}
  var p=el('div','sm-sheet'),tiles=el('div','sm-tiles');
  [['listen',L.listen,'player-play'],['15i',L.playlist,'playlist-add'],['15h',lk?L.unlike:L.like,'heart'],['link',L.link,'share']].forEach(function(x){
    var b=el('button','sm-tile'+(x[0]==='listen'?' sm-play':''));var sp=el('span',null,x[1]);b.appendChild(icon(x[2]));b.appendChild(sp);
    b.addEventListener('click',function(e){e.stopPropagation();if(x[0]==='listen')say(msg('15c','play'));else if(x[0]==='link'){if(u)copyLink(u,sp);}else if(x[0]==='15h')say(msg('15h',lk?'unlike':'like'));else say(msg(x[0],''));});
    tiles.appendChild(b);});
  p.appendChild(tiles);p.appendChild(el('div','sm-hint',L.nplay));
  var o=el('button','sm-act');o.appendChild(icon('external-link'));o.appendChild(el('span',null,L.open));o.addEventListener('click',function(e){e.stopPropagation();go(u);});
  var head=null;
  A.forEach(function(x){
    if(x.h){head=el('div','sm-sh',L[x.h]);return;}
    if(x.only&&x.only!==k)return;if(x.own&&!own)return;if(x.ctx&&x.ctx!==ctx)return;if(!id8)return;
    if(head){p.appendChild(head);head=null;}
    var b=el('button','sm-act');b.appendChild(icon(x.i));b.appendChild(el('span',null,L[x.l]));
    if(x.s)b.appendChild(el('span','sm-cost',L[x.s]));
    b.addEventListener('click',function(e){e.stopPropagation();if(x.c==='mix'){p.remove();mix={a:{r:r,id8:id8,t:me.t},b:null};mixDraw();return;}say(msg(x.c,x.a));});
    p.appendChild(b);});
  p.appendChild(o);p.appendChild(el('div','sm-hint',L.app));
  r.insertAdjacentElement('afterend',p);
});});
document.querySelectorAll('.sm-sub').forEach(function(x){x.textContent=x.textContent.replace(/(\s·\s*)+$/,'');});
mixDraw();if(list.getAttribute('data-mix')==='1'&&!pick&&!ctx){mix={a:null,b:null};mixDraw();}
})();
</script>
